<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="700" height="360" fill="#ffffff"/>
  <text x="350" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">Proving the J-space causes what the model says</text>

  <!-- Before -->
  <text x="175" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">Before swap</text>
  <rect x="60" y="80" width="230" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="175" y="100" text-anchor="middle" font-size="12" fill="#0C447C">"Think of a sport"</text>
  <text x="175" y="118" text-anchor="middle" font-size="11" fill="#185FA5">J-space top word: Soccer</text>
  <line x1="175" y1="130" x2="175" y2="160" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a6)"/>
  <rect x="60" y="162" width="230" height="38" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.5"/>
  <text x="175" y="186" text-anchor="middle" font-size="12" fill="#042C53" font-weight="bold">Model says: "Soccer"</text>

  <!-- swap operator -->
  <circle cx="350" cy="140" r="30" fill="#FAC775" stroke="#854F0B" stroke-width="1.5"/>
  <text x="350" y="136" text-anchor="middle" font-size="11" fill="#412402" font-weight="bold">swap</text>
  <text x="350" y="150" text-anchor="middle" font-size="10" fill="#412402">Soccer -></text>
  <text x="350" y="163" text-anchor="middle" font-size="10" fill="#412402">Rugby</text>

  <!-- After -->
  <text x="525" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#712B13">After swap</text>
  <rect x="410" y="80" width="230" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="525" y="100" text-anchor="middle" font-size="12" fill="#712B13">"Think of a sport"</text>
  <text x="525" y="118" text-anchor="middle" font-size="11" fill="#993C1D">J-space top word: Rugby</text>
  <line x1="525" y1="130" x2="525" y2="160" stroke="#993C1D" stroke-width="1.5" marker-end="url(#a7)"/>
  <rect x="410" y="162" width="230" height="38" rx="8" fill="#F0997B" stroke="#993C1D" stroke-width="1.5"/>
  <text x="525" y="186" text-anchor="middle" font-size="12" fill="#4A1B0C" font-weight="bold">Model says: "Rugby"</text>

  <text x="350" y="250" text-anchor="middle" font-size="12" fill="#444441">Everything else about the activation is left untouched. Only the</text>
  <text x="350" y="268" text-anchor="middle" font-size="12" fill="#444441">J-space content changes -- and the model's spoken answer changes</text>
  <text x="350" y="286" text-anchor="middle" font-size="12" fill="#444441">to match. That is what makes this a causal result, not a correlation.</text>

  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#185FA5"/></marker>
    <marker id="a7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#993C1D"/></marker>
  </defs>
</svg>
